[package]
name = "game-translator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
oar-ocr = { version = "0.9", features = ["auto-download"] }
axum = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "process", "signal", "fs", "io-util", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
