# The shipped settings, embedded in the app. Yours go in
# ~/.config/fukidashi/config.toml (written by the settings page), holding only
# what differs from these; profiles and styles in ~/.config/fukidashi/profiles
# and styles add to the shipped ones, or replace one of the same file name.

listen = "127.0.0.1:4404"
# Frames received are saved here, for testing (e.g. "~/.local/share/fukidashi/captures");
# empty: not saved.
capture_dir = ""
# Each game's memory (past translations, learned names); empty: none. By
# default ~/.local/share/fukidashi/data.
# data_dir = "~/.local/share/fukidashi/data"
# Used when RetroArch does not send `target_lang`.
default_target_lang = "en"

[ocr]
# PP-OCR (detection + recognition) on CPU. Model names are downloaded on first
# use (SHA-256 checked) into $OAR_HOME, by default ~/.cache/fukidashi/ocr;
# a path (~/... allowed) uses a local file instead.
detection = "pp-ocrv6_small_det.onnx"
recognition = "pp-ocrv6_medium_rec.onnx"
dictionary = "ppocrv6_dict.txt"
min_confidence = 0.6
# Minimum mean text score inside a detected box: lower finds faint or stylized
# labels (KimiKiss's スキ needs 0.5), at the cost of a few more stray fragments.
box_threshold = 0.5
# Frames are resized to this width before OCR: small pixel fonts read much better
# upscaled (480 px PSP frame -> 960), and big frames only cost time.
width = 960

[translate]
# "local": the model below, served by [translate.server]; "remote": the provider
# of [translate.remote]. Both can be switched in the settings page
# (http://localhost:4404/), whose choices are saved in ~/.config/fukidashi.
provider = "local"
url = "http://127.0.0.1:8194/v1/chat/completions"
model = "gemma-4-26b-a4b"
temperature = 0.1
max_tokens = 512
# Number of past exchanges kept as context; trimmed to half when exceeded.
history = 16
system_prompt = """
You translate Japanese video game text into natural {lang} for a player who is learning Japanese.
Rules:
- Keep Japanese honorifics and forms of address as they are (-san, -kun, -chan, -sama, -senpai, -sensei, onii-chan...).
- Keep the speaker's tone and register (casual, polite, rough, childish).
- Give one translation per block: never alternatives ("Home Economics/Home Ec."), notes or explanations.
- Write numbers with Latin digits (〇点 = 0 points).
- Character names in romaji, family/given order as in the original.
- A speaker name before 「」 stays as a prefix: Name: "..."; unknown speakers "???" stay "???". A speaker shown by what they are rather than by a name (女の子, 男子生徒, 先生, 店員) is translated, like any word: Girl, Student, Teacher, Clerk.
- Input: a JSON object of text blocks from one screen, keyed by id; ⏎ marks a line break in the original. Blocks are independent, but may share context.
- Output: a JSON object with the same ids, each holding the translation of that block only, without ⏎. Write quotation marks as “ ”, never as straight quotes. Join lines that form one sentence; keep a line break (\\n) only between separate items, as in a list or a profile card.
- Also return "names": every person name found in the blocks (names only, not words for people such as 女の子 or 先生), as written in Japanese, mapped to the romaji you used ({} if none). Use the readings of the glossary and of the names already used, when given.
"""

# A remote OpenAI-compatible provider (only the text is sent, never the image).
# The API key comes from the FUKIDASHI_API_KEY environment variable, or is
# saved from the settings page in ~/.config/fukidashi/secrets.toml.
[translate.remote]
url = "https://openrouter.ai/api/v1"
model = "google/gemma-4-26b-a4b-it"

# Started by the app when nothing answers on `url` (a server of your own
# answering there is used as is), with one of the models below.
[translate.server]
# llama.cpp build, downloaded once into ~/.cache/fukidashi/runtimes:
# "auto" picks it from the GPU (strix: ROCm for AMD Strix Halo; cuda: NVIDIA;
# vulkan: other GPUs; cpu: none). Also "strix", "vulkan", "cuda", "cuda12",
# "cuda13", "cpu". To run your own build instead, set command = "/path/to/llama-server"
# or the LLAMA_SERVER environment variable.
runtime = "auto"
# "latest", or a release tag to stay on ("b11856"; strix builds count apart: "b1030").
release = "latest"
# At start, at most once a day: "auto" installs a newer build in the background
# for the next start (back to the previous one if it fails to start), "notify"
# only says so in the log, "off" never looks.
update = "auto"
# A model of [translate.models] below; the one chosen in the page takes
# precedence. Or a file of your own, "owner/repo:file.gguf" on Hugging Face,
# asked like a chat model (its draft model in `draft`).
model = "gemma-4-26b"
# Arguments of the draft model used for speculative decoding (dropped if your
# llama.cpp rejects it).
draft_args = ["--spec-type", "draft-mtp", "-ngld", "999"]
# Minutes without a translation after which the server stops, freeing the GPU
# memory; the next translation starts it again (a few seconds). 0: never.
idle_minutes = 30
# For every model (each adds its own `args`). No -ngl: llama.cpp fits the model
# to the GPU memory free when it starts (the game's included): all of it on the
# GPU when it fits, else part of it in RAM (MoE experts first), slower but
# working. --fit-target is the GPU memory it leaves free, in MiB: enough for a
# draft model, which it does not count. Flash attention: "auto" turns it on
# wherever the GPU supports it.
args = ["-fa", "auto", "--fit-target", "1536", "--no-webui"]

# The local models offered in the page, which proposes the best one fitting the
# computer: `gpu_memory` (GB of GPU memory it runs well with) or, without a
# GPU, `ram` (GB of RAM; absent: too slow without a GPU). Files are
# "owner/repo:file" on Hugging Face, downloaded once into its cache; `files`
# replaces `file` for one kind of build. `quality` (1 to 5) and `summary` are
# shown in the page.
#
# Two kinds of models:
# - mode = "chat" (instruction models): the whole screen in one request (JSON),
#   with the previous lines as context and [translate] system_prompt as
#   instructions; they also return the character names they read, learned for
#   the next screens.
# - mode = "translate" (translation models): one request per block, `prompt`,
#   where {terms} becomes the glossary entries and names already known that the
#   block uses, {lang} the target language, {text} the block. No context and no
#   names learned: write them in the game's profile or its Names tab.

[translate.models.gemma-4-26b]
name = "Gemma 4 26B-A4B"
quality = 5
summary = "Natural translations that keep each character's voice. Reads the whole screen at once, follows the conversation and learns character names."
gpu_memory = 16
size = 17.5
mode = "chat"
file = "unsloth/gemma-4-26b-a4b-it-GGUF:gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf"
# FP4 runs natively on recent NVIDIA GPUs.
files = { cuda = "unsloth/gemma-4-26b-a4b-it-GGUF:gemma-4-26B-A4B-it-MXFP4_MOE.gguf" }
# Speculative decoding (multi-token prediction).
draft = "unsloth/gemma-4-26b-a4b-it-GGUF:MTP/mtp-gemma-4-26B-A4B-it-Q8_0.gguf"
# Thinking off: Gemma 4 otherwise spends its token budget reasoning. One slot:
# each request reuses the cached prompt of the previous one.
args = ["-c", "16384", "-np", "1", "--reasoning-budget", "0", "--chat-template-kwargs", '{"enable_thinking":false}']
request = { chat_template_kwargs = { enable_thinking = false } }

# Hy-MT2 (Tencent): translation models, with the sampling of their model card.
# Four slots: the blocks of a screen are translated in parallel.
[translate.models.hy-mt2-30b]
name = "Hy-MT2 30B-A3B"
quality = 4
summary = "Translation model: very good translations, close to Gemma 4 26B, and fast without a GPU given enough RAM. Translates each text alone: character names come from the game's profile or its Names tab."
ram = 28
size = 18.2
mode = "translate"
file = "tencent/Hy-MT2-30B-A3B-GGUF:Hy-MT2-30B-A3B-Q4_K_M.gguf"
args = ["-c", "8192", "-np", "4"]
temperature = 0.7
request = { top_p = 1.0, top_k = 0, repeat_penalty = 1.0 }
prompt = """{terms}Translate the following text into {lang}. Note that you must ONLY output the translated result without any additional explanation:

{text}"""

[translate.models.hy-mt2-7b]
name = "Hy-MT2 7B"
quality = 4
summary = "Translation model: good, natural translations, fast on an 8 GB graphics card. Translates each text alone: character names come from the game's profile or its Names tab."
gpu_memory = 6
size = 4.6
mode = "translate"
file = "tencent/Hy-MT2-7B-GGUF:Hy-MT2-7B-Q4_K_M.gguf"
args = ["-c", "8192", "-np", "4"]
temperature = 0.7
request = { top_p = 0.6, top_k = 20, repeat_penalty = 1.05 }
prompt = """{terms}Translate the following text into {lang}. Note that you must ONLY output the translated result without any additional explanation:

{text}"""

[translate.models.hy-mt2-1-8b]
name = "Hy-MT2 1.8B"
quality = 2
summary = "Small translation model: understandable, with mistakes in meaning; for small graphics cards or computers without one. Translates each text alone: character names come from the game's profile or its Names tab."
gpu_memory = 3
ram = 8
size = 1.9
mode = "translate"
file = "tencent/Hy-MT2-1.8B-GGUF:Hy-MT2-1.8B-Q8_0.gguf"
args = ["-c", "8192", "-np", "4"]
temperature = 0.7
request = { top_p = 0.6, top_k = 20, repeat_penalty = 1.05 }
prompt = """{terms}Translate the following text into {lang}. Note that you must ONLY output the translated result without any additional explanation:

{text}"""

[render]
# Font for the translations (bundled Noto Sans Bold when unset; the bundled
# Noto Sans JP Bold draws the characters it lacks: ♡, ♪, →, Japanese), e.g.:
# font = "~/.local/share/fonts/MyFont.ttf"
# Overlay width in pixels; RetroArch stretches it over the game (or the whole
# screen, see screen_aspect).
width = 1920
# Used where the game's box behind the text is not a plain colour (a picture, a
# gradient); otherwise the backdrop takes that box's colour, with black or white
# text, whichever reads better (sample_background = false: always these).
background = [16, 16, 24, 240]
text_color = [255, 255, 255, 255]
sample_background = true
# Outline in the backdrop colour around the letters, as a fraction of the font
# size (0 to disable): keeps text readable over a see-through backdrop.
outline = 0.07
# RetroArch 1.22 and older stretch the overlay over the whole screen, black bars
# included, so a 4:3 game on a 16:9 screen needs the screen's aspect: "auto"
# reads the primary screen's current mode (xrandr), or set it (e.g. "16:9").
# Newer RetroArch builds fit the overlay to the game: use "game".
screen_aspect = "auto"

