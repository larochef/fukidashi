# Every push and pull request: lints and tests, layout cases included.
# Every push to main that passes them is also published as a release, numbered
# like llama.cpp's builds: v<major.minor of Cargo.toml>.<commits on main>.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    needs: check
    if: github.event_name == 'push'
    # The oldest runner the prebuilt ONNX Runtime links on (glibc 2.38+), so the
    # binary also starts on distributions as old as Ubuntu 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One release at a time, in push order.
    concurrency: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Version
        # Written into Cargo.toml, so the binary (`fukidashi --version`) and the
        # packages carry it.
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version' | cut -d. -f1,2)
          version="$base.$(git rev-list --count HEAD)"
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: cargo build --release
      - name: Package
        run: |
          # .deb and .rpm: the files listed in Cargo.toml's package.metadata.
          cargo deb --no-build --output fukidashi_${VERSION}_amd64.deb
          cargo generate-rpm --output fukidashi-${VERSION}.x86_64.rpm
          # The archive: the app, and what the packages install beside it (for
          # the AUR package, or by hand).
          dir=fukidashi-$TAG-x86_64-linux
          mkdir -p $dir/icons $dir/gnome-extension/schemas
          cp target/release/fukidashi README.md LICENSE packaging/fukidashi.service packaging/fukidashi.desktop $dir/
          cp assets/icons/fukidashi.svg assets/icons/fukidashi-symbolic.svg $dir/icons/
          cp gnome-extension/*.js gnome-extension/metadata.json $dir/gnome-extension/
          cp gnome-extension/schemas/*.xml $dir/gnome-extension/schemas/
          tar czf $dir.tar.gz $dir
          # The GNOME Shell extension alone, for `gnome-extensions install`.
          command -v glib-compile-schemas zip > /dev/null || sudo apt-get install -y -qq libglib2.0-bin zip
          glib-compile-schemas gnome-extension/schemas
          (cd gnome-extension && zip -r ../fukidashi@larochef.github.io.zip .)
          sha256sum $dir.tar.gz *.deb *.rpm fukidashi@larochef.github.io.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" fukidashi-*.tar.gz *.deb *.rpm fukidashi@larochef.github.io.zip SHA256SUMS
          --target "$GITHUB_SHA" --title "$TAG" --generate-notes
